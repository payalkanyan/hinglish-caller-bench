id: delivery_stolen_package
domain: delivery
caller_goal: >
  Your smartphone order worth Rs 19,999 was marked as "delivered" yesterday but you never
  received it — you were home all day and nobody rang your doorbell. The package may have
  been stolen from outside your door or delivered to the wrong flat. Please check tracking
  and then escalate to file a theft/misdelivery complaint immediately.
hidden_facts:
  - key: order_id
    value: "ORD-22004"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
expected_tool_calls:
  - name: track_delivery
    args:
      order_id: "ORD-22004"
  - name: escalate_to_human
    args: {}
precedence:
  - [track_delivery, escalate_to_human]
forbidden:
  - name: escalate_to_human
    max_count: 1
success_state:
  escalations:
    - status: escalated
max_turns: 12
