id: refund_damaged_food
domain: refund
caller_goal: >
  You ordered a box of organic mangoes for Rs 599 but about 70 percent of them arrived
  rotten and inedible. The box was intact so it must have been packed with bad fruit.
  You want a full refund of Rs 599 to your UPI — this is unacceptable for a food order.
hidden_facts:
  - key: order_id
    value: "ORD-11008"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
  - key: upi_id
    value: "fatima.k@paytm"
    reveal_if:
      - "upi"
      - "refund account"
      - "payment details"
      - "bank account"
expected_tool_calls:
  - name: lookup_order
    args:
      order_id: "ORD-11008"
  - name: initiate_refund
    args:
      order_id: "ORD-11008"
      amount: 599
precedence:
  - [lookup_order, initiate_refund]
forbidden:
  - name: initiate_refund
    max_count: 1
success_state:
  refunds:
    - order_id: "ORD-11008"
      amount: 599
      status: initiated
max_turns: 12
