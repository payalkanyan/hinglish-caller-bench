id: delivery_ofd_not_attempted
domain: delivery
caller_goal: >
  Your winter jacket order shows "out for delivery" since this morning but it is now
  7 PM and nobody has shown up. You have been at home all day. Either the app is lying
  or the courier did not bother attempting delivery. Check the tracking status and then
  escalate this to a senior team — you want someone who can actually coordinate with
  the courier to call you back, not just a generic "we'll look into it".
hidden_facts:
  - key: order_id
    value: "ORD-22007"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
expected_tool_calls:
  - name: track_delivery
    args:
      order_id: "ORD-22007"
  - name: escalate_to_human
    args: {}
precedence:
  - [track_delivery, escalate_to_human]
forbidden:
  - name: escalate_to_human
    max_count: 1
success_state:
  escalations:
    - status: escalated
max_turns: 12
