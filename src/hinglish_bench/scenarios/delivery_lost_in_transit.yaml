id: delivery_lost_in_transit
domain: delivery
caller_goal: >
  You ordered an expensive gaming console worth Rs 29,999 and the tracking shows it was
  marked "lost in transit" by the carrier. You want to check the current status, then
  demand that the agent escalate this immediately so a replacement or refund can be
  arranged as soon as possible — this is an urgent high-value case.
hidden_facts:
  - key: order_id
    value: "ORD-22001"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
expected_tool_calls:
  - name: track_delivery
    args:
      order_id: "ORD-22001"
  - name: escalate_to_human
    args: {}
precedence:
  - [track_delivery, escalate_to_human]
forbidden:
  - name: escalate_to_human
    max_count: 1
success_state:
  escalations:
    - status: escalated
max_turns: 12
