id: emi_shift_to_20th
domain: emi_reminder
caller_goal: >
  You are a freelancer and your clients typically pay you around the 18th of each month.
  Your loan EMI is currently due on the 8th which means you always pay late and incur fees.
  You want the due date changed to the 20th so you have funds available before the deadline.
hidden_facts:
  - key: loan_id
    value: "LN-5000007"
    reveal_if:
      - "loan id"
      - "loan number"
      - "account number"
      - "loan account"
      - "loan details"
expected_tool_calls:
  - name: check_emi_status
    args:
      loan_id: "LN-5000007"
  - name: reschedule_emi
    args:
      loan_id: "LN-5000007"
      new_due_day: 20
precedence:
  - [check_emi_status, reschedule_emi]
forbidden:
  - name: reschedule_emi
    max_count: 1
success_state:
  emis:
    - loan_id: "LN-5000007"
      due_day: 20
max_turns: 12
