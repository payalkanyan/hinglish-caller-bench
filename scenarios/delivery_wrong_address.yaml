id: delivery_wrong_address
domain: delivery
caller_goal: >
  Your silk saree worth Rs 5,999 was delivered to the wrong building in your apartment
  complex — the courier left it at building B but you live in building D. You confirmed
  the address in the app is correct. Check delivery status first, then insist that the
  agent escalate this so someone can arrange recovery and re-delivery.
hidden_facts:
  - key: order_id
    value: "ORD-22003"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
expected_tool_calls:
  - name: track_delivery
    args:
      order_id: "ORD-22003"
  - name: escalate_to_human
    args: {}
precedence:
  - [track_delivery, escalate_to_human]
forbidden:
  - name: escalate_to_human
    max_count: 1
success_state:
  escalations:
    - status: escalated
max_turns: 12
