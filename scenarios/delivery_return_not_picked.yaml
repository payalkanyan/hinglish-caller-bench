id: delivery_return_not_picked
domain: delivery
caller_goal: >
  You scheduled a return pickup for a kurta 4 days ago and received a confirmation SMS,
  but nobody has come to collect it. The return window is closing soon and you are worried
  it will expire. Check the delivery status and then escalate — you need a pickup to be
  scheduled and completed before the return window closes.
hidden_facts:
  - key: order_id
    value: "ORD-22008"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
expected_tool_calls:
  - name: track_delivery
    args:
      order_id: "ORD-22008"
  - name: escalate_to_human
    args: {}
precedence:
  - [track_delivery, escalate_to_human]
forbidden:
  - name: escalate_to_human
    max_count: 1
success_state:
  escalations:
    - status: escalated
max_turns: 12
