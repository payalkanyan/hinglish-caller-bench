id: delivery_premium_downgraded
domain: delivery
caller_goal: >
  You paid extra for same-day delivery of urgent medicines for Rs 799 but the tracking
  shows standard 3-day delivery instead. The medicines are needed today for a family
  member. Please check the delivery status and immediately escalate — you want either
  the same-day delivery fulfilled or an urgent alternative arranged.
hidden_facts:
  - key: order_id
    value: "ORD-22010"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
expected_tool_calls:
  - name: track_delivery
    args:
      order_id: "ORD-22010"
  - name: escalate_to_human
    args: {}
precedence:
  - [track_delivery, escalate_to_human]
forbidden:
  - name: escalate_to_human
    max_count: 1
success_state:
  escalations:
    - status: escalated
max_turns: 12
