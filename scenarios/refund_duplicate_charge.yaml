id: refund_duplicate_charge
domain: refund
caller_goal: >
  You ordered one silk scarf for Rs 599 but your bank statement shows two deductions
  of Rs 599 each — you were charged twice for a single order. You want the duplicate
  charge of Rs 599 refunded to your UPI immediately.
hidden_facts:
  - key: order_id
    value: "ORD-11004"
    reveal_if:
      - "order id"
      - "order number"
      - "order no"
      - "order details"
  - key: upi_id
    value: "amit.k@phonepe"
    reveal_if:
      - "upi"
      - "refund account"
      - "payment details"
      - "bank account"
expected_tool_calls:
  - name: lookup_order
    args:
      order_id: "ORD-11004"
  - name: initiate_refund
    args:
      order_id: "ORD-11004"
      amount: 599
precedence:
  - [lookup_order, initiate_refund]
forbidden:
  - name: initiate_refund
    max_count: 1
success_state:
  refunds:
    - order_id: "ORD-11004"
      amount: 599
      status: initiated
max_turns: 12
