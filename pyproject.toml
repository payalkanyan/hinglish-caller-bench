[project]
name = "hinglish-caller-bench"
version = "0.1.0"
description = "Stress-test AI customer-service agents with simulated Hinglish, Hindi and English callers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Payal", email = "youcancallmepayal@gmail.com" }]
keywords = ["hinglish", "hindi", "benchmark", "llm", "eval", "customer-service", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40,<2",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/payalkanyan/hinglish-caller-bench"
Repository = "https://github.com/payalkanyan/hinglish-caller-bench"
Issues = "https://github.com/payalkanyan/hinglish-caller-bench/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
hcb = "hinglish_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hinglish_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
