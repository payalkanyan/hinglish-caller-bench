[project]
name = "hinglish-caller-bench"
version = "0.1.0"
description = "Stress-test AI customer-service agents with simulated Hinglish, Hindi and English callers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hinglish_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
